# GENERATED — do not edit. Edit the scenario's integration.yaml instead.
# Rendered from integration.yaml as the TUNED variant.
# knobs: buffer=256, listeners=64, workers=64.

# Scenario 004 — internal queue round trip. Single source of truth.
#
# Two root flows joined by a queue, with a knob on each side:
#
#   submit  (HTTP)   workers/buffer/pool   — blocks waiting for the reply
#   worker  (queue)  listeners             — concurrent handlers draining the queue
#
# Each tunable is declared in exactly ONE place, so TUNED_WORKERS reaches only the
# producer and TUNED_LISTENERS only the consumer. The worker flow deliberately
# declares no workers/buffer/pool of its own: on the consumer side `listeners` is
# the concurrency control being measured, and a second knob in the same path would
# confound it.
#
# `queue-dispatch` with awaitReply makes the round trip synchronous, which is what
# makes it measurable from k6 at all — fire-and-forget would return before the work
# happened and measure nothing but the enqueue.

service:
  name: perf-queue-roundtrip
  environment: benchmark

env:
  - name: HTTP_PORT
    default: "8080"

connectors:
  - name: api
    type: http
    settings:
      port: ${HTTP_PORT}

  # Settings-free: the queue connector binds to the runtime's queue service. In
  # the default build that is in-process; a k8s build backs it with NATS.
  - name: bus
    type: queue

flows:
  # ---- producer: HTTP in, dispatch, wait for the reply ----------------------
  - name: submit
    workers: 64
    buffer: 256
    pool: 8
    source:
      connector: api
      type: http
      settings:
        path: /job
    process:
      - type: multi-transform
        name: prepare
        settings:
          transforms:
            - setVar: jobId
              value: eventID
            - setBody: >-
                {"jobId": eventID, "tenant": body.tenant,
                 "units": body.units, "weight": body.weight}

      # Blocks until a consumer replies, so this flow's worker count caps how many
      # round trips can be in flight — the same blocking regime as scenario 003.
      - type: queue-dispatch
        name: dispatch
        settings:
          subject: '"work.jobs"'
          awaitReply: true
          timeout: 30s

      - type: set-payload
        name: respond
        settings:
          value: >-
            {"jobId": vars.jobId,
             "score": body.score,
             "band": body.band,
             "handled": body.handled,
             "status": "ok"}

  # ---- consumer: drain the queue, do the work, reply ------------------------
  - name: worker
    source:
      connector: bus
      type: queue
      settings:
        subject: work.jobs
        listeners: 64
        timeout: 30s
    process:
      - type: multi-transform
        name: compute
        settings:
          transforms:
            - setVar: score
              value: 'body.weight * double(body.units) * 1.37'
            - setVar: band
              value: 'vars.score > 500.0 ? "high" : (vars.score > 150.0 ? "medium" : "low")'
      - type: set-payload
        name: reply
        settings:
          value: >-
            {"jobId": body.jobId,
             "score": vars.score,
             "band": vars.band,
             "handled": true}

  # Readiness probe. The measured route is a POST requiring a body, and Octo has no
  # built-in health endpoint. This one deliberately does NOT touch the queue, so a
  # saturated queue cannot make the target look unready mid-run.
  - name: health
    source:
      connector: api
      type: http
      settings:
        path: /health
    process:
      - type: set-payload
        settings:
          value: '{"status": "ok"}'
