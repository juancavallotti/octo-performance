# GENERATED — do not edit. Edit the scenario's integration.yaml instead.
# Rendered from integration.yaml as the BASELINE variant.
# stripped: buffer, maxIdleConns, maxOpenConns, pool, workers — the runtime uses its own defaults.

# Scenario 003 — Postgres CRUD. Single source of truth for this integration.
#
# The first scenario whose flow BLOCKS. Every request makes three round trips to
# Postgres, so a worker spends most of its life waiting on I/O rather than on CPU.
# That is the regime where `workers` is supposed to matter — and where it meets a
# second, competing limit in `maxOpenConns`: more workers than connections just
# queues on the pool instead of the channel.
#
# TUNABLES (see scenario.env) therefore spans both: workers/buffer/pool on the
# flow, maxOpenConns/maxIdleConns on the connector.

service:
  name: perf-postgres-crud
  environment: benchmark

env:
  - name: HTTP_PORT
    default: "8080"
  - name: PG_DSN
    default: "postgres://postgres:octobench@localhost:55432/octobench?sslmode=disable"

connectors:
  - name: api
    type: http
    settings:
      port: ${HTTP_PORT}

  - name: db
    type: database
    settings:
      driver: postgres
      dsn: ${PG_DSN}
      # Rendered per arm, like the flow knobs above.
      connMaxLifetime: 5m

flows:
  - name: order-crud
    source:
      connector: api
      type: http
      settings:
        path: /order
    process:
      # eventID is unique per message, so concurrent requests never collide on the
      # primary key and no cleanup is needed between runs.
      - type: multi-transform
        name: prepare
        settings:
          transforms:
            - setVar: orderId
              value: eventID
            - setVar: customer
              value: body.customer
            - setVar: channel
              value: body.channel
            - setVar: amount
              value: body.amount

      # WRITE
      - type: sql
        name: insert-order
        settings:
          connector: db
          query: >-
            INSERT INTO orders (id, customer, channel, amount)
            VALUES ($1, $2, $3, $4)
          args:
            - vars.orderId
            - vars.customer
            - vars.channel
            - vars.amount
          exec: true

      # READ back — read-your-own-write, the round trip that dominates latency.
      - type: sql
        name: read-order
        settings:
          connector: db
          query: >-
            SELECT id, customer, channel, amount
            FROM orders WHERE id = $1
          args:
            - vars.orderId
          single: true

      - type: set-variable
        name: capture-read
        settings:
          name: readCustomer
          value: body.customer

      # DELETE, so the table stays bounded across a 60s run at thousands of req/s.
      - type: sql
        name: delete-order
        settings:
          connector: db
          query: DELETE FROM orders WHERE id = $1
          args:
            - vars.orderId
          exec: true

      - type: set-payload
        name: respond
        settings:
          value: >-
            {"orderId": vars.orderId,
             "customer": vars.readCustomer,
             "deleted": body.rowsAffected,
             "status": "ok"}

  # Readiness probe: the measured route is a POST requiring a body, and Octo has
  # no built-in health endpoint. Touches the database so that "ready" means the
  # connection pool works, not merely that the HTTP server is listening.
  - name: health
    source:
      connector: api
      type: http
      settings:
        path: /health
    process:
      - type: sql
        settings:
          connector: db
          query: SELECT 1 AS ok
          single: true
      - type: set-payload
        settings:
          value: '{"status": "ok"}'
