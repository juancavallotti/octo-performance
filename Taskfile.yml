version: '3'

# The performance lab's entry points.
#
# Thin on purpose: the substance lives in harness/, as one Go module with tests. The
# previous version of this file drove thirty shell and Python files under lab/bin/ and
# had a task per experiment shape — bench, sweep, vuramp, profile, capacity, compare —
# each of which re-implemented start, warm up, sample, measure, stop, cool down around a
# copy-pasted k6 invocation, and each of which drifted from the others.
#
# There is one procedure now. A sweep is a campaign with one repetition and an arm per
# grid point. A capacity probe is the calibration phase. A VU ramp is the closed model
# with an arm per level. The experiment is described in campaigns/*.yaml, which is
# checked in and archived with the result.

vars:
  CAMPAIGN: '{{.CAMPAIGN | default "campaigns/smoke-all.yaml"}}'
  OUT: '{{.OUT | default "campaigns/out"}}'
  PERF: '{{.ROOT_DIR}}/harness/bin/perf'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # --- the harness ---------------------------------------------------------

  test:
    desc: 'Run the harness test suite — no VM, no network, seconds'
    dir: harness
    cmds:
      - go vet ./...
      - go test -race ./...

  fmt:
    desc: 'Format the harness'
    dir: harness
    cmds:
      - gofmt -w .

  build:
    desc: 'Build perf into harness/bin/'
    dir: harness
    cmds:
      - go build -o bin/perf ./cmd/perf
      - go build -o bin/fakeocto ./cmd/fakeocto

  # --- running a campaign --------------------------------------------------

  plan:
    desc: 'Print what a campaign will do, before it does it. CAMPAIGN=campaigns/x.yaml'
    deps: [build]
    cmds:
      - '{{.PERF}} plan --campaign {{.CAMPAIGN}}'

  run:
    desc: 'Run a campaign. Hours — background it and poll. CAMPAIGN=campaigns/x.yaml'
    deps: [build]
    cmds:
      - '{{.PERF}} run --campaign {{.CAMPAIGN}} --out {{.OUT}}'

  smoke:
    desc: 'Every scenario, both arms, eight seconds a cell. Plumbing check, not a result.'
    deps: [build]
    cmds:
      - '{{.PERF}} run --campaign campaigns/smoke-all.yaml --out {{.OUT}}'

  # --- checks --------------------------------------------------------------

  verify:
    desc: 'Everything that can be checked without starting a runtime'
    cmds:
      - task: test
      - task: verify:terraform

  verify:terraform:
    desc: 'Validate the infrastructure definition'
    dir: infra/terraform
    cmds:
      - terraform fmt -check
      - terraform init -backend=false -input=false
      - terraform validate

  # --- housekeeping --------------------------------------------------------

  clean:
    desc: 'Remove build output'
    cmds:
      - rm -rf harness/bin

  clean:campaigns:
    desc: 'Remove every campaign directory. Destructive, and it asks first.'
    prompt: 'Delete every campaign under {{.OUT}}?'
    cmds:
      - rm -rf {{.OUT}}
