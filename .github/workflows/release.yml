# release-please decides when and what; goreleaser builds it.
#
# release-please watches conventional-commit subjects scoped to the harness, opens a
# release PR that accumulates the changelog and bumps the version, and on merge tags
# harness/vX.Y.Z. That tag triggers goreleaser, which publishes the binaries the VM
# startup scripts install.
#
# Only harness-scoped commits move the version. A commit that adds a scenario or records
# a result is not a harness change and does not need a prefix.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs['harness--release_created'] }}
      tag: ${{ steps.rp.outputs['harness--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version from the tag, so it needs the full history
          # and the tag that release-please just pushed.
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
