# Scenario 001 — template page.
#
# One flow, one block: an HTTP source renders a template resource straight into the
# response body. No dependencies, no I/O wait, no log block in the hot path. It is the
# cheapest thing the runtime can do, which makes it the scenario where per-request
# overhead is most visible and the one to reach for first when the harness itself is
# under suspicion.

route: /page/octo

tunables:
  - workers
  - buffer
  - pool

load:
  test: steady
  model: open

  # Measured, not declared. The old lab carried STEADY_RATE=16000, calibrated from a
  # real capacity ramp on an M1 Pro where the knee sat at 32–36k req/s and 16k was
  # deliberately half of it: enough load that queueing is real, low enough that a
  # healthy baseline drops nothing.
  #
  # That reasoning was sound and the number is now worthless. It was calibrated on
  # 2026-07-25 with the load generator sharing the host, and by the next day every
  # cell at that rate was shedding 260k–630k iterations. A rate calibrated once is a
  # constant in the code and a variable in reality, so each campaign measures its own
  # knee and runs every arm of this scenario at the same measured fraction of it.
  calibrate: true
  calibrateFraction: 0.5

  duration: 60s
  warmup: 10s

  # Sizes the VU pool by Little's law, and it must come from the TAIL rather than the
  # median. Median latency here is ~0.1 ms but p99 reached 10–20 ms even on healthy
  # runs; a momentary concurrency spike that exhausts the pool makes the generator
  # shed iterations, which reads in a report as server saturation when it is a
  # generator artifact. This is the input to a recorded value, not a threshold.
  expectedLatency: 25ms

  # A hard ceiling. Reaching it means the generator was still scaling to keep up,
  # which is the condition that made the old results bimodal — 1,600 VUs on a healthy
  # run against 7,113 on a collapsed one, same binary.
  vuCap: 16000

# The ramp that measures the rate above. The old lab's ramp on m1pro-16gb put the knee
# at 32-36k req/s and folded over at 40k, so the peak brackets it rather than stopping
# short — a ramp that never reaches the knee reports a lower bound and nothing more.
capacity:
  # Raised from 2,000–40,000, which was bracketed for the laptop above and is below this
  # runtime's floor on a c4-standard-8: the ramp held every rung to 40,000 and delivered
  # 39,909 of it with zero drops at 0.233 ms, so 40,000 was never a knee, only the place
  # the ramp stopped.
  #
  # 120,000 comes from the cost measured at the rate below it rather than from taste. At
  # 20,000 req/s the subject spent 0.0738 cpu-ms per request — 147.5% of the 800% it has
  # — which puts eight saturated cores near 108,000 req/s if cost per request holds.
  # The peak sits above that so the fold is inside the ramp rather than at its edge.
  #
  # Read the top of this one against the generator, not only the subject. The runner was
  # at 256% of its 1,600% at 20,000 req/s, so a linear extrapolation has it near 1,280%
  # around 100,000 — close enough to its own limit that a knee found up there may be k6's
  # rather than the runtime's. The loadgen.saturation gate is what tells the two apart,
  # and a fold reported while the generator is saturated is not a capacity result.
  startRate: 10000
  peakRate: 120000
  steps: 10
  dwell: 15s

thresholds:
  p95: 20ms
  p99: 50ms

calibration: |
  The knee on m1pro-16gb was 32–36k req/s: CPU scaled linearly to ~310% of one core
  at 36k, then folded over at 40k, where CPU fell to 260% while the generator shed
  9,161 iterations. Superseded — that host ran the generator alongside the subject.
