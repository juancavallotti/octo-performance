# Scenario 005 — HTTP proxy. Single source of truth for this integration.
#
# The canonical API-gateway shape: an inbound request passed through to a backend
# that takes 70 ms to answer, with the response returned to the caller. 70 ms is a
# realistic figure for a remote service call — a database-backed API in another
# availability zone, or a third-party endpoint over the public internet.
#
# The 70 ms is the whole point. Every other scenario in this lab is CPU-bound, so a
# request occupies a worker only for as long as it takes to compute. Here a request
# occupies a worker for 70 ms of doing nothing, which turns `workers` from a
# second-order tuning knob into the single number that decides the throughput
# ceiling:
#
#     ceiling ≈ workers / seconds_blocked = 8 / 0.070 ≈ 114 req/s
#
# The harness derives both arms; baseline strips the knobs so the
# runtime uses its own defaults.

service:
  name: perf-proxy
  environment: benchmark

env:
  - name: HTTP_PORT
    default: "8080"
  - name: BACKEND_URL
    default: "http://localhost:9090"
  - name: BACKEND_DELAY
    default: "70ms"
  - name: BACKEND_SIZE
    default: "1024"

connectors:
  - name: api
    type: http
    settings:
      port: ${HTTP_PORT}

  - name: backend
    type: http-client
    settings:
      baseURL: ${BACKEND_URL}
      # Must exceed the backend delay by a wide margin: a timeout here would turn a
      # saturation measurement into an error-rate measurement.
      timeout: 30s
      # Default is 1 MiB, which is exactly the largest payload on the size ladder —
      # so the default would truncate the very case it is meant to measure.
      maxResponseBytes: 4194304

flows:
  - name: proxy
    # Rendered per arm. These values apply only when running the file directly.
    workers: 8
    buffer: 64
    pool: 8
    source:
      connector: api
      type: http
      settings:
        path: /proxy/{id}
    process:
      # The entire integration. Nothing else runs in the hot path, so what is
      # measured is the runtime's ability to hold concurrent in-flight requests.
      - type: rest
        name: passthrough
        settings:
          connector: backend
          method: GET
          path: /payload
          query:
            size: env.BACKEND_SIZE
            delay: env.BACKEND_DELAY

  # Readiness probe. Deliberately does NOT touch the backend: the harness polls this
  # until it answers, and a probe that depended on the backend would report the
  # backend's readiness rather than the runtime's.
  - name: health
    source:
      connector: api
      type: http
      settings:
        path: /health
    process:
      - type: set-payload
        settings:
          value: '{"status": "ok"}'
