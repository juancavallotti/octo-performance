# Did 0.6.0 regress against 0.5.0?
#
# This file is the campaign: what is being compared, how many times, in what order, and
# on what hardware. It is archived verbatim beside the result, so the intent of a run is
# recoverable from the run — which is the thing the old lab's directory-name labels
# (-mON, -mOFF, -probesonly, -metricson) could never be.

name: regression-050-vs-060
question: Did 0.6.0 regress against 0.5.0 on any scenario?

scenarios:
  - 001-template-page

arms:
  - name: "0.5.0"
    binary: {version: "0.5.0"}
    config: {mode: baseline}
  - name: "0.6.0"
    binary: {version: "0.6.0"}
    config: {mode: baseline}

# Five repetitions, arms rotating between them. Three was the old minimum and it was
# not enough: the deltas it produced sat well inside the spread of the measurements
# they were drawn from.
reps: 5
cooldown: 30s

load:
  duration: 60s

# No topology block. run.go builds it from --subject-ssh and --deps-ssh, and records
# colocation from the hosts that actually ran rather than from what the spec asked for.
# The addresses that used to be here (10.128.0.2/3) matched no machine that has ever run
# this campaign, and were archived beside the result as if they had.

gates:
  # The first campaigns record every gate's evidence without excluding anything, so the
  # thresholds can be set from the observed distribution rather than guessed. Nobody has
  # measured what a healthy runner-CPU ceiling looks like on this hardware, because the
  # hardware is new.
  observeOnly: true
